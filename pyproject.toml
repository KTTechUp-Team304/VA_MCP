[project]
name = "va-mcp"
version = "0.1.0"
description = "Vulnerability Analyzer MCP Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.27.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "openai>=1.0.0",
]

[project.scripts]
va-mcp = "va_mcp.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

# 통과한 테스트에서도 로그를 터미널에 표시(LOG_LEVEL=DEBUG와 tests/conftest.py와 함께 사용)
[tool.pytest.ini_options]
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(levelname)s %(name)s: %(message)s"
markers = [
    "integration: 실제 외부 API를 호출하는 통합 테스트. pytest -m integration 으로 실행",
]
